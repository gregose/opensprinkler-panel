name: CI

on:
  push:
    branches: [main]
  pull_request:

# Toolchain versions are kept identical to .github/workflows/copilot-setup-steps.yml
# so the Copilot cloud agent, local cloud sessions, and CI all build with the
# same tools. The ESP32 platform/toolchain itself is pinned in platformio.ini
# (espressif32@7.0.1), so it is identical everywhere by construction.
env:
  PYTHON_VERSION: "3.11"
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PLATFORMIO_VERSION }}"
      - name: Run unit tests
        run: pio test -e native

  firmware-build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-fw-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PLATFORMIO_VERSION }}"
      - name: Build firmware
        run: pio run -e cyd-35r
