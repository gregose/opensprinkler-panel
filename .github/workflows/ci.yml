name: CI

on:
  push:
  pull_request:

# Toolchain versions are kept identical to .github/workflows/copilot-setup-steps.yml
# so the Copilot cloud agent, local cloud sessions, and CI all build with the
# same tools. The ESP32 platform/toolchain itself is pinned in platformio.ini
# (espressif32@7.0.1), so it is identical everywhere by construction.
env:
  PYTHON_VERSION: "3.11"
  PLATFORMIO_VERSION: "6.1.19"
  ESPTOOL_VERSION: "4.11.0"
  # Artifact base names; the short commit SHA is appended per run so multiple
  # builds are distinguishable when downloading/flashing (tools/flash.sh matches
  # these by prefix). Keep in sync with tools/flash.sh.
  PROD_ARTIFACT_BASE: "cyd-35r-firmware"
  DIAG_ARTIFACT_BASE: "cyd-35r-diag-firmware"

jobs:
  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PLATFORMIO_VERSION }}"
      - name: Run unit tests
        run: pio test -e native

  firmware-build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve build metadata
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-fw-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PLATFORMIO_VERSION }}" "esptool==${{ env.ESPTOOL_VERSION }}"

      # Production firmware (M6 UI). Build + package BEFORE the diag build, which
      # overwrites the shared .pio/build toolchain outputs that merge_bin reads.
      - name: Build production firmware (cyd-35r)
        run: pio run -e cyd-35r
      - name: Package production firmware
        run: tools/package-firmware.sh cyd-35r firmware-artifact/production --web
      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROD_ARTIFACT_BASE }}-${{ steps.meta.outputs.sha }}
          path: firmware-artifact/production/

      # Diagnostic bring-up firmware. Built AFTER the production artifact is
      # packaged because building this env perturbs the shared .pio/build output
      # dir (it would wipe cyd-35r's bootloader.bin before merge_bin runs).
      - name: Build diagnostic firmware (cyd-35r-diag)
        run: GIT_SHA=${{ steps.meta.outputs.sha }} pio run -e cyd-35r-diag
      - name: Package diagnostic firmware
        run: tools/package-firmware.sh cyd-35r-diag firmware-artifact/diag
      - name: Upload diagnostic firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIAG_ARTIFACT_BASE }}-${{ steps.meta.outputs.sha }}
          path: firmware-artifact/diag/
