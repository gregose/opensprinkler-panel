name: "Copilot Setup Steps"

# Prepares the Copilot cloud agent's ephemeral dev environment with the SAME
# toolchain CI uses (see .github/workflows/ci.yml): Python 3.11 + PlatformIO
# 6.1.19 + esptool 4.11.0, plus the ESP32 platform/libraries pinned in
# platformio.ini
# (espressif32@7.0.1). Pre-installing the packages here means cloud sessions
# start with the toolchain warm instead of discovering it by trial and error.
#
# Runs automatically when this file changes so it can be validated, and can be
# triggered manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install PlatformIO + esptool
        run: pip install "platformio==6.1.19" "esptool==4.11.0"

      - name: Pre-install ESP32 + native toolchains and libraries
        run: |
          pio pkg install -e cyd-35r
          pio pkg install -e native

      # Pre-warm libraries that individual milestones will add to platformio.ini
      # DURING the agent's work phase, after these setup steps have already run.
      # The agent's runtime firewall may block registry.platformio.org, so fetch
      # them here (full network) into global storage where the LDF can find them.
      # This is why M5 (#6) initially vendored Unity — avoid that by pre-warming.
      # If you add libraries not listed here, either add them to this list or
      # allowlist registry.platformio.org in the coding agent firewall settings.
      - name: Pre-warm milestone libraries (global)
        run: |
          pio pkg install -g --library "throwtheswitch/Unity@^2.6.0"
          pio pkg install -g --library "bblanchon/ArduinoJson@^7"
          pio pkg install -g --library "bodmer/TFT_eSPI@^2.5"
          pio pkg install -g --library "lvgl/lvgl@^9.2"
          pio pkg install -g --library "tzapu/WiFiManager@^2.0"
