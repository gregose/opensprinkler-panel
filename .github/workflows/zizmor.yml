name: Workflow security (zizmor)

# Static security analysis of our own GitHub Actions workflows with zizmor
# (https://docs.zizmor.sh). This matters because release.yml can publish signed
# firmware to a GitHub Release: a compromised or careless workflow is a
# supply-chain risk. zizmor catches template injection, credential persistence,
# cache poisoning, over-broad token permissions, unpinned actions, and similar
# issues before they ship.
#
# zizmor emits SARIF that is uploaded to GitHub code scanning, so findings show
# up in the repo's Security tab and inline on PRs. On top of that, the "Fail on
# findings" step below gates the build directly, so PRs are blocked on any
# finding without needing a code-scanning ruleset configured.
on:
  push:
    branches: [main]
  pull_request:
    # Workflow security is cheap to check on every PR, and a workflow can be
    # touched indirectly (e.g. a renamed script it calls), so we don't
    # path-filter this.

# ZIZMOR_VERSION is pinned so the linter upgrades deliberately (the same way
# ci.yml pins its build tools). PYTHON_VERSION here is just the host interpreter
# that runs `pip install zizmor` — zizmor ships as a prebuilt wheel and behaves
# the same across 3.10+, so this is intentionally NOT coupled to the firmware
# build toolchain and is not part of tools/check_toolchain_consistency.py.
env:
  PYTHON_VERSION: "3.11"
  ZIZMOR_VERSION: "1.28.0"

# security-events: write lets the SARIF upload populate code scanning. contents
# and actions stay read-only (actions:read lets upload-sarif read workflow run
# info).
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install zizmor
        run: pip install "zizmor==${{ env.ZIZMOR_VERSION }}"
      - name: Run zizmor
        # SARIF output for code scanning. GITHUB_TOKEN enables zizmor's online
        # audits (e.g. resolving whether `uses:` refs are pinned to a real
        # commit). In --format=sarif mode zizmor always exits 0, so the "Fail on
        # findings" step below is what actually gates the build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=sarif .github/workflows/ > results.sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        # Tolerated during the window before code scanning is enabled on this
        # repo; the "Fail on findings" step is the authoritative pass/fail so a
        # not-yet-available Security tab never silently drops a real finding.
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: zizmor
      - name: Fail on findings
        run: |
          count="$(jq '[.runs[].results[]] | length' results.sarif)"
          if [[ "$count" -gt 0 ]]; then
            echo "::error::zizmor reported $count finding(s); see the run log / Security tab."
            zizmor --format=plain .github/workflows/ || true
            exit 1
          fi
          echo "zizmor: no findings."
