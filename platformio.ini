; OpenSprinkler Panel - PlatformIO config
; Board: Hosyond ESP32-3248S035R / E32R35T ("CYD"): classic ESP32-WROOM-32E,
; no PSRAM, ST7796U display + XPT2046 resistive touch on a shared SPI bus.
; See docs/03-architecture.md for the full pin map and rationale.
;
; Firmware envs:
;   cyd-35r      — production firmware (M6 UI, OTA + optional TCP log via NVS)
;   cyd-35r-diag — diagnostic bring-up firmware (src/diag/ only)

[platformio]
default_envs = cyd-35r

; ---------------------------------------------------------------------------
; Shared hardware configuration reused by both ESP32 firmware envs.
; This is a custom base section (not a buildable target) — both [env:cyd-35r]
; and [env:cyd-35r-diag] inherit from it via `extends = cyd_common`.
; Extracted so the pin map and LVGL settings stay in one place.
; ---------------------------------------------------------------------------
[cyd_common]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
; min_spiffs.csv: dual-OTA (app0 + app1, 1920 KB each) + minimal SPIFFS.
; default.csv only gives 1280 KB per partition — too small for the 1.4 MB app.
; OTA rewrites only the app partition, leaving NVS intact, so the dual-OTA
; layout here enables wireless firmware updates (tools/ota.sh).
; ArduinoOTA.begin() is called at runtime only when NVS ota_pass is set.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++14
  ; TFT_eSPI: use build-flag setup (no User_Setup.h) — pin map from docs/03.
  -D USER_SETUP_LOADED=1
  ; With USER_SETUP_LOADED, TFT_eSPI compiles ONLY the fonts enabled here.
  ; Without these, drawString()/print() render nothing (graphics still work).
  ; LOAD_GLCD covers the diag firmware's setTextSize()/GLCD text + the
  ; calibrateTouch() on-screen prompts; the rest are small, commonly-used faces.
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=40000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D SPI_READ_FREQUENCY=20000000
  ; LVGL: explicitly add the project include/ dir to all compilation units
  ; (including library code like LVGL) so lv_conf.h is resolved correctly.
  -Iinclude
  -D LV_CONF_INCLUDE_SIMPLE=1

; ---------------------------------------------------------------------------
; Production firmware — full M6 UI.  Excludes src/diag/ so the diag sources
; never interfere with the production build.
; ---------------------------------------------------------------------------
[env:cyd-35r]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  tzapu/WiFiManager@^2.0
  bblanchon/ArduinoJson@^7
build_src_filter = +<*> -<diag/>
; FW_GIT_SHA is injected by CI (GIT_SHA env var); falls back to "dev" in C++.
; Shown on the boot screens + web-portal brand line.
build_flags =
  ${cyd_common.build_flags}
  -D FW_GIT_SHA='"${sysenv.GIT_SHA}"'
  ; FW_VERSION is injected by the release workflow (FW_VERSION env var, the git
  ; tag); falls back to "dev" in C++ when unset (empty string from sysenv).
  -D FW_VERSION='"${sysenv.FW_VERSION}"'

; ---------------------------------------------------------------------------
; Diagnostic / bring-up firmware.  Compiles only src/diag/ — shares the pin
; map and LVGL config from cyd_common but has no production UI code.
; Flash with: pio run -e cyd-35r-diag --target upload
; ---------------------------------------------------------------------------
[env:cyd-35r-diag]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  bblanchon/ArduinoJson@^7
build_src_filter = +<diag/>
; FW_GIT_SHA is injected by CI (GIT_SHA env var); falls back to "dev" in C++.
build_flags =
  ${cyd_common.build_flags}
  -D FW_GIT_SHA='"${sysenv.GIT_SHA}"'
  -D FW_VERSION='"${sysenv.FW_VERSION}"'
  ; Diag-only: enable LVGL logging (WARN -> Serial) via lv_conf.h so a failing
  ; LVGL assert prints instead of hanging silently. Not set for production.
  -D OSP_DIAG_BUILD=1

; ---------------------------------------------------------------------------
; S3 bring-up spike (issue #140) — DIAG ONLY, fully additive.
;
; Target board: Waveshare ESP32-S3-Touch-LCD-3.5 (non-B): ESP32-S3R8 (8 MB OPI
; PSRAM, 16 MB flash), ST7796 display over 4-wire SPI @80 MHz, FT6336 capacitive
; touch (I2C 0x38), AXP2101 PMIC (I2C 0x34), TCA9554 IO expander (I2C 0x20, drives
; the LCD reset line). See issue #120 for the confirmed chipset, full pin map, and
; vendor demo references.
;
; This env deliberately does NOT extend cyd_common: the CYD pin map, esp32dev
; board, and min_spiffs partition table do not apply to the S3. It also does NOT
; share src/ with the cyd envs. Its bring-up harness lives in the top-level
; s3diag/ dir (compiled via build_src_filter escaping to +<../s3diag/>, the same
; escape-hatch the sim env uses for sim/). That keeps this source compiled ONLY
; here: cyd-35r (+<*> -<diag/>) never scans it, and cyd-35r-diag (+<diag/>) never
; scans it, so neither existing env is disturbed and the S3-only libs below are
; never pulled into them.
;
; Not in default_envs — build explicitly: pio run -e s3-touch-35-diag
; Flash (bench, USB-CDC): pio run -e s3-touch-35-diag --target upload
; ---------------------------------------------------------------------------
[env:s3-touch-35-diag]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3R8: 8 MB OPI PSRAM + 16 MB flash. qio_opi selects the octal-SPI PSRAM
; timing; flash stays QIO. Override the devkit defaults (which assume 8 MB flash).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Custom 16 MB dual-OTA table (see the file header). min_spiffs.csv is CYD-only.
board_build.partitions = partitions_s3_16mb.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  ; S3-only bring-up libraries. Mirrored into copilot-setup-steps.yml pre-warm
  ; (repo rule) — never vendored into lib/.
  lewisxhe/SensorLib@^0.4.1
  lewisxhe/XPowersLib@^0.3.3
  RobTillaart/TCA9554@^0.1.3
; Compile ONLY the S3 diag harness from the top-level s3diag/ dir (see header).
build_src_filter = -<*> +<../s3diag/>
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++14
  ; Route Serial over the native USB-CDC port so the bring-up log appears the
  ; moment the board enumerates over USB (what Greg watches on the bench).
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; 8 MB OPI PSRAM present — lets LVGL/large buffers land in PSRAM if needed.
  -D BOARD_HAS_PSRAM
  ; TFT_eSPI: build-flag setup (no User_Setup.h), ST7796 over SPI, S3 pin map
  ; from issue #120. CS/MISO are not wired (write-only panel on a dedicated bus);
  ; reset is driven from TCA9554 pin 1 in software, so TFT_RST is -1 here.
  -D USER_SETUP_LOADED=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MOSI=1
  -D TFT_SCLK=5
  -D TFT_MISO=-1
  -D TFT_CS=-1
  -D TFT_DC=3
  -D TFT_RST=-1
  -D TFT_BL=6
  -D SPI_FREQUENCY=80000000
  ; LVGL: add the project include/ dir to every compilation unit (incl. LVGL) so
  ; lv_conf.h resolves — same convention as cyd_common.
  -Iinclude
  -D LV_CONF_INCLUDE_SIMPLE=1
  ; Diag-only marker (mirrors cyd-35r-diag's OSP_DIAG_BUILD intent).
  -D OSP_DIAG_BUILD=1
  -D OSP_S3_DIAG=1
  -D FW_GIT_SHA='"${sysenv.GIT_SHA}"'
  -D FW_VERSION='"${sysenv.FW_VERSION}"'

; ---------------------------------------------------------------------------
; Native host env — runs the hardware-independent unit tests in CI.
; Only compiles the pure-C++ libraries under lib/ (no Arduino, no src/).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps = bblanchon/ArduinoJson@^7
; lib/ui pulls in LVGL, which the native unit-test env neither links nor needs.
; The LDF would skip it anyway (no test includes it), but ignore it explicitly.
lib_ignore = ui

; ---------------------------------------------------------------------------
; Host LVGL simulator - renders the REAL firmware screen code (lib/ui) to a
; 480x320 PNG on the host, so we can preview LVGL faithfully (no HTML->LVGL
; drift) and generate docs screenshots headlessly. Same class as `native`:
; platform = native, NEVER cross-compiles for ESP32 and NEVER flashes.
;
; Links LVGL (pinned, same as firmware) + SDL2 (via sdl2-config: macOS
; `brew install sdl2`, Ubuntu `libsdl2-dev`). Builds ONLY the sim/ sources
; (build_src_filter escapes src/ to the top-level sim/ dir), plus lib/ui and
; lib/station_model + lib/battery_monitor for the top-bar logic.
;
; lv_conf.h is SHARED with the firmware (include/lv_conf.h) via
; LV_CONF_INCLUDE_SIMPLE; the OSP_SIM define only toggles LV_USE_SDL, so the
; compiled Montserrat fonts and color depth are byte-identical to the firmware.
; ---------------------------------------------------------------------------
[env:sim]
platform = native
lib_deps =
  lvgl/lvgl@^9.2
  bblanchon/ArduinoJson@^7
; The sim now links the portable view-model libs (station_model, program_model,
; os_client, panel_state, battery_monitor) so it can drive lib/ui screens from
; fixtures exactly like the firmware. Only the Arduino-coupled libs are ignored:
; panel_config (Preferences/NVS) and bench_probe (Arduino serial capture).
lib_ignore = panel_config bench_probe
; Build only the host sim entrypoint (top-level sim/), not the Arduino src/.
; The countdown font (src/ui_font_countdown_48.c) is pure LVGL (no Arduino), so
; the sim links the SAME font glyphs the firmware uses instead of a shim.
build_src_filter = -<*> +<../sim/> +<../src/ui_font_countdown_48.c>
build_flags =
  -std=gnu++17
  -DOSP_SIM=1
  -Iinclude
  -Isim
  -DLV_CONF_INCLUDE_SIMPLE=1
  !sdl2-config --cflags
  !sdl2-config --libs
