; OpenSprinkler Station Control Panel — PlatformIO config
;
; Supported boards (both are ESP32-WROOM-32E, ST7796U SPI display, 4 MB flash):
;   ESP32-3248S035R ("CYD", resistive)  — XPT2046 touch, shared SPI bus
;   ESP32-3248S035C ("CYD", capacitive) — GT911 I2C touch (SDA33/SCL32/INT21/RST25)
;
; See docs/03-architecture.md for the full pin maps and rationale.
;
; Firmware envs:
;   cyd-35r      — 035R production firmware (M6 UI, OTA + optional TCP log via NVS)
;   cyd-35r-diag — 035R diagnostic bring-up firmware (src/diag/ only)
;   cyd-35c      — 035C production firmware (GT911 capacitive touch)
;   cyd-35c-diag — 035C diagnostic bring-up firmware (src/diag/ only)

[platformio]
default_envs = cyd-35r

; ---------------------------------------------------------------------------
; Shared hardware configuration — display/LVGL only (no touch flags).
; Both boards share the identical ST7796U display wiring and LVGL config.
; Touch-specific flags are added per-board in the individual env sections.
; ---------------------------------------------------------------------------
[cyd_common]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
; min_spiffs.csv: dual-OTA (app0 + app1, 1920 KB each) + minimal SPIFFS.
; default.csv only gives 1280 KB per partition — too small for the 1.4 MB app.
; OTA rewrites only the app partition, leaving NVS intact, so the dual-OTA
; layout here enables wireless firmware updates (tools/ota.sh).
; ArduinoOTA.begin() is called at runtime only when NVS ota_pass is set.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++14
  ; TFT_eSPI: use build-flag setup (no User_Setup.h) — pin map from docs/03.
  -D USER_SETUP_LOADED=1
  ; With USER_SETUP_LOADED, TFT_eSPI compiles ONLY the fonts enabled here.
  ; Without these, drawString()/print() render nothing (graphics still work).
  ; LOAD_GLCD covers the diag firmware's setTextSize()/GLCD text + the
  ; calibrateTouch() on-screen prompts; the rest are small, commonly-used faces.
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; LVGL: explicitly add the project include/ dir to all compilation units
  ; (including library code like LVGL) so lv_conf.h is resolved correctly.
  -Iinclude
  -D LV_CONF_INCLUDE_SIMPLE=1

; ---------------------------------------------------------------------------
; 035R production firmware — full M6 UI.  Excludes src/diag/ so the diag
; sources never interfere with the production build.
; Touch: XPT2046 resistive on the shared SPI bus (TOUCH_CS=33).
; ---------------------------------------------------------------------------
[env:cyd-35r]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  tzapu/WiFiManager@^2.0
  bblanchon/ArduinoJson@^7
build_src_filter = +<*> -<diag/>
build_flags =
  ${cyd_common.build_flags}
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000

; ---------------------------------------------------------------------------
; 035R diagnostic / bring-up firmware.  Compiles only src/diag/ — shares the
; display/LVGL config from cyd_common but has no production UI code.
; Flash with: pio run -e cyd-35r-diag --target upload
; Touch: XPT2046 resistive on the shared SPI bus (TOUCH_CS=33).
; ---------------------------------------------------------------------------
[env:cyd-35r-diag]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  bblanchon/ArduinoJson@^7
build_src_filter = +<diag/>
; FW_GIT_SHA is injected by CI (GIT_SHA env var); falls back to "dev" in C++.
build_flags =
  ${cyd_common.build_flags}
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000
  -D FW_GIT_SHA='"${sysenv.GIT_SHA}"'
  ; Diag-only: enable LVGL logging (WARN -> Serial) via lv_conf.h so a failing
  ; LVGL assert prints instead of hanging silently. Not set for production.
  -D OSP_DIAG_BUILD=1

; ---------------------------------------------------------------------------
; 035C production firmware — full M6 UI.  Excludes src/diag/.
; Touch: GT911 capacitive over I2C (SDA33/SCL32/INT21/RST25).
; TOUCH_GT911=1 gates the GT911 path in src/; no TOUCH_CS so TFT_eSPI does
; not attempt to drive the SPI touch controller.
; ---------------------------------------------------------------------------
[env:cyd-35c]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  tzapu/WiFiManager@^2.0
  bblanchon/ArduinoJson@^7
  tamctec/TAMC_GT911@^1.0.2
build_src_filter = +<*> -<diag/>
build_flags =
  ${cyd_common.build_flags}
  -D TOUCH_GT911=1
  -D GT911_SDA=33
  -D GT911_SCL=32
  -D GT911_INT=21
  -D GT911_RST=25

; ---------------------------------------------------------------------------
; 035C diagnostic / bring-up firmware.  Compiles only src/diag/.
; Touch: GT911 capacitive over I2C (TOUCH_GT911=1).
; Flash with: pio run -e cyd-35c-diag --target upload
; ---------------------------------------------------------------------------
[env:cyd-35c-diag]
extends = cyd_common
lib_deps =
  bodmer/TFT_eSPI@^2.5
  lvgl/lvgl@^9.2
  bblanchon/ArduinoJson@^7
  tamctec/TAMC_GT911@^1.0.2
build_src_filter = +<diag/>
; FW_GIT_SHA is injected by CI (GIT_SHA env var); falls back to "dev" in C++.
build_flags =
  ${cyd_common.build_flags}
  -D TOUCH_GT911=1
  -D GT911_SDA=33
  -D GT911_SCL=32
  -D GT911_INT=21
  -D GT911_RST=25
  -D FW_GIT_SHA='"${sysenv.GIT_SHA}"'
  ; Diag-only: enable LVGL logging (WARN -> Serial) via lv_conf.h so a failing
  ; LVGL assert prints instead of hanging silently. Not set for production.
  -D OSP_DIAG_BUILD=1

; ---------------------------------------------------------------------------
; Native host env — runs the hardware-independent unit tests in CI.
; Only compiles the pure-C++ libraries under lib/ (no Arduino, no src/).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps = bblanchon/ArduinoJson@^7
